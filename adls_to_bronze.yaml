job:
  name: "user_events_adls_to_bronze"
  description: "Load user events from ADLS to Bronze layer"
  
  unity_catalog:
    catalog: "prod_catalog"  # UC catalog name
    schema: "bronze"         # UC schema name
    create_if_not_exists: true
  
  source:
    type: "adls"
    path: "abfss://raw@storage.dfs.core.windows.net/user_events"
    format: "json"
  
  transformations:
    - name: "raw_extract"
      view: "raw_view"
      sql: >
        SELECT 
          *, 
          current_timestamp() as _ingestion_time,
          input_file_name() as _source_file
        FROM read_files(
          '${source.path}',
          format => '${source.format}'
        )
  
  target:
    type: "delta"
    table: "user_events"
    load_strategy: "upsert"
    primary_key: ["event_id"]
    partition_columns: ["date(event_time)"]
    schema_evolution: true
    optimize_settings:
      auto_optimize: true
      zorder_columns: ["user_id"]
  
  checkpoint:
    location: "abfss://checkpoints@storage.dfs.core.windows.net/adls_to_bronze"