environments:
  dev:
    storage:
      account_name: "devstorage"
      containers:
        raw: "raw-dev"
        archive: "archive-dev"
        bronze: "bronze-dev"
        silver: "silver-dev"
        gold: "gold-dev"
        checkpoints: "checkpoints-dev"
        schemas: "schemas-dev"
    paths:
      raw: "abfss://${storage.containers.raw}@${storage.account_name}.dfs.core.windows.net"
      archive: "abfss://${storage.containers.archive}@${storage.account_name}.dfs.core.windows.net"
      bronze: "abfss://${storage.containers.bronze}@${storage.account_name}.dfs.core.windows.net"
      silver: "abfss://${storage.containers.silver}@${storage.account_name}.dfs.core.windows.net"
      gold: "abfss://${storage.containers.gold}@${storage.account_name}.dfs.core.windows.net"
      checkpoints: "abfss://${storage.containers.checkpoints}@${storage.account_name}.dfs.core.windows.net"
      schemas: "abfss://${storage.containers.schemas}@${storage.account_name}.dfs.core.windows.net"
    databricks:
      catalog: "dev_catalog"
      schema_prefix: "dev_"

  prod:
    storage:
      account_name: "prodstorage"
      containers:
        raw: "raw"
        archive: "archive"
        bronze: "bronze"
        silver: "silver"
        gold: "gold"
        checkpoints: "checkpoints"
        schemas: "schemas"
    paths:
      raw: "abfss://${storage.containers.raw}@${storage.account_name}.dfs.core.windows.net"
      archive: "abfss://${storage.containers.archive}@${storage.account_name}.dfs.core.windows.net"
      bronze: "abfss://${storage.containers.bronze}@${storage.account_name}.dfs.core.windows.net"
      silver: "abfss://${storage.containers.silver}@${storage.account_name}.dfs.core.windows.net"
      gold: "abfss://${storage.containers.gold}@${storage.account_name}.dfs.core.windows.net"
      checkpoints: "abfss://${storage.containers.checkpoints}@${storage.account_name}.dfs.core.windows.net"
      schemas: "abfss://${storage.containers.schemas}@${storage.account_name}.dfs.core.windows.net"
    databricks:
      catalog: "prod_catalog"
      schema_prefix: ""